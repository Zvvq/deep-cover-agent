[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-cover-agent"
version = "0.1.0"
description = "Event-driven Python Agent Runtime for the Deep Cover game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
deep-cover-agent = "deep_cover_agent.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_cover_agent = ["prompts/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".conda", ".deps", ".venv", ".venv*", "pytest-cache-files-*"]
